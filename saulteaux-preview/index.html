<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#06343d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>My First Saulteaux Words — GBA Art Preview</title>
  <style>
    :root {
      --sea-deep: #052b39;
      --sea: #087d82;
      --sea-light: #39c8b7;
      --cream: #fff1c7;
      --gold: #f3c35c;
      --ink: #132f35;
      --panel: rgba(3, 23, 31, .9);
      --line: rgba(255, 241, 199, .42);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--sea-deep); }
    body {
      color: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Trebuchet MS", sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    button, img { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    button { font: inherit; }

    .app {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: radial-gradient(circle at 50% -10%, #1ea59f 0, #0b5965 36%, var(--sea-deep) 78%);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
      background: rgba(3, 28, 36, .93);
      border-bottom: 2px solid rgba(255, 241, 199, .2);
      z-index: 5;
    }
    .brand { min-width: 0; flex: 1; }
    .eyebrow {
      margin: 0;
      color: var(--gold);
      font-size: clamp(10px, 1.5vw, 14px);
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      margin: 2px 0 0;
      color: var(--cream);
      font-size: clamp(17px, 3vw, 30px);
      line-height: 1;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .top-actions { display: flex; gap: 8px; }

    .button {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 8px 11px;
      color: var(--cream);
      background: #0b535c;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .03em;
      white-space: nowrap;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .button:hover, .button:focus-visible { background: #127e82; border-color: var(--gold); outline: none; }
    .button:active { transform: translateY(1px); }
    .button.primary { background: var(--gold); border-color: #ffe9a0; color: var(--ink); }

    .stage-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 10px 12px 0;
    }
    .stage {
      position: relative;
      width: min(100%, 1400px);
      aspect-ratio: 16 / 9;
      max-height: 100%;
      overflow: hidden;
      background: #071d28;
      border: 3px solid rgba(255, 241, 199, .45);
      border-radius: 10px;
      box-shadow: 0 9px 0 rgba(0, 0, 0, .28);
    }
    #mapCanvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .stage-label {
      position: absolute;
      left: 12px;
      top: 12px;
      max-width: min(50%, 430px);
      padding: 8px 10px;
      border: 2px solid rgba(255, 241, 199, .65);
      border-radius: 7px;
      color: var(--cream);
      background: rgba(3, 28, 36, .82);
      font-size: clamp(11px, 1.8vw, 17px);
      font-weight: 800;
      line-height: 1.15;
      pointer-events: none;
    }
    .status {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 7px 9px;
      border: 2px solid rgba(255, 241, 199, .6);
      border-radius: 7px;
      color: var(--cream);
      background: rgba(3, 28, 36, .84);
      font-size: clamp(10px, 1.5vw, 14px);
      font-weight: 800;
      pointer-events: none;
    }

    .worldbar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
      background: rgba(3, 28, 36, .96);
      border-top: 2px solid rgba(255, 241, 199, .2);
      scrollbar-width: none;
      z-index: 5;
    }
    .worldbar::-webkit-scrollbar { display: none; }
    .world-button { flex: 0 0 auto; min-width: 114px; font-size: 12px; padding: 8px 9px; }
    .world-button.active { border-color: var(--gold); background: #1d8580; }

    .drawer {
      position: fixed;
      inset: auto 12px max(70px, calc(env(safe-area-inset-bottom) + 66px));
      max-height: min(58vh, 520px);
      display: none;
      grid-template-rows: auto 1fr;
      border: 2px solid var(--gold);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
      z-index: 10;
    }
    .drawer.open { display: grid; }
    .drawer-head { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { flex: 1; }
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      overflow: auto;
      padding: 10px;
    }
    .asset-card { margin: 0; min-width: 0; color: var(--cream); font-size: 11px; font-weight: 800; }
    .asset-card img { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 1px solid rgba(255, 241, 199, .3); background: #ff00ff; }
    .asset-card figcaption { padding-top: 4px; }

    @media (orientation: portrait) {
      .stage-wrap { padding: 8px 8px 0; }
      .stage { width: 100%; }
      .world-button { min-width: 105px; }
      .drawer { inset-inline: 8px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Saulteaux GBA art preview">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Artwork-first preview</p>
        <h1>My First Saulteaux Words</h1>
      </div>
      <div class="top-actions">
        <button class="button" id="overviewButton" type="button">Overview</button>
        <button class="button primary" id="assetsButton" type="button">Art locker</button>
      </div>
    </header>

    <section class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="mapCanvas" aria-label="Animated Turtle Island map"></canvas>
        <div class="stage-label" id="stageLabel">Turtle Island overview</div>
        <div class="status" id="statusLabel">Turquoise water · flowing preview</div>
      </div>
    </section>

    <nav class="worldbar" aria-label="World camera destinations" id="worldBar"></nav>
  </main>

  <aside class="drawer" id="assetDrawer" aria-label="Generated art assets">
    <div class="drawer-head">
      <strong>Generated GBA artwork so far</strong>
      <button class="button" id="closeAssetsButton" type="button">Close</button>
    </div>
    <div class="asset-grid">
      <figure class="asset-card"><img src="assets/master/turtle-island-gba-style.png" alt="Turtle Island master map"><figcaption>Master Turtle Island</figcaption></figure>
      <figure class="asset-card"><img src="assets/characters/makwa-walk-sheet-gba.png" alt="Makwa walk cycle sheet"><figcaption>Makwa walk cycle</figcaption></figure>
      <figure class="asset-card"><img src="assets/characters/eagle-prompt-sheet-gba.png" alt="Eagle prompt portraits"><figcaption>Eagle prompt portraits</figcaption></figure>
      <figure class="asset-card"><img src="assets/characters/eagle-flying-sheet-gba.png" alt="Flying eagle cycle sheet"><figcaption>Flying eagle cycle</figcaption></figure>
      <figure class="asset-card"><img src="assets/objects/object-atlas-01-gba.png" alt="First object atlas"><figcaption>Object atlas 01</figcaption></figure>
      <figure class="asset-card"><img src="assets/objects/object-atlas-02-gba.png" alt="Second object atlas"><figcaption>Object atlas 02</figcaption></figure>
      <figure class="asset-card"><img src="assets/objects/object-atlas-03-gba.png" alt="Third object atlas"><figcaption>Object atlas 03</figcaption></figure>
      <figure class="asset-card"><img src="assets/objects/object-atlas-04-gba.png" alt="Fourth object atlas"><figcaption>Object atlas 04</figcaption></figure>
      <figure class="asset-card"><img src="assets/water/ocean-wave-cycle-8frames-gba.png" alt="Eight-frame turquoise wave atlas"><figcaption>Turquoise wave cycle</figcaption></figure>
    </div>
  </aside>

  <script>
    (() => {
      'use strict';
      const MAP_W = 1672;
      const MAP_H = 941;
      const canvas = document.getElementById('mapCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const stage = document.getElementById('stage');
      const stageLabel = document.getElementById('stageLabel');
      const statusLabel = document.getElementById('statusLabel');
      const worldBar = document.getElementById('worldBar');
      const overviewButton = document.getElementById('overviewButton');
      const assetsButton = document.getElementById('assetsButton');
      const assetDrawer = document.getElementById('assetDrawer');
      const closeAssetsButton = document.getElementById('closeAssetsButton');

      const worlds = [
        { title: 'World 1 · Water and Turtle Island', crop: [0, 222, 560, 315] },
        { title: 'World 2 · Forest and Meadow', crop: [200, 70, 560, 315] },
        { title: 'World 3 · Open Meadow Trail', crop: [620, 20, 560, 315] },
        { title: 'World 4 · Wetlands and Sky', crop: [930, 160, 560, 315] },
        { title: 'World 5 · Berry Meadow and Garden', crop: [200, 380, 560, 315] },
        { title: 'World 6 · Home, Camp and Craft', crop: [520, 220, 560, 315] },
        { title: 'World 7 · Community Teaching Grove', crop: [520, 460, 560, 315] }
      ];

      const mapImage = new Image();
      mapImage.src = 'assets/master/turtle-island-gba-style.png';
      const waveFrames = Array.from({ length: 8 }, (_, i) => {
        const img = new Image();
        img.src = `assets/water/frames/frame-${String(i).padStart(2, '0')}.png`;
        return img;
      });
      const maskCanvas = document.createElement('canvas');
      const maskCtx = maskCanvas.getContext('2d');
      const overlayCanvas = document.createElement('canvas');
      const overlayCtx = overlayCanvas.getContext('2d');
      let waterMaskReady = false;
      let waveFrame = 0;
      let waveShift = 0;
      let activeWorld = -1;
      let camera = { x: 0, y: 0, w: MAP_W, h: MAP_H };
      let cameraFrom = { ...camera };
      let cameraTo = { ...camera };
      let cameraStart = 0;
      const CAMERA_MS = 850;

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        render();
      }

      function buildWaterMask() {
        if (!mapImage.complete || !mapImage.naturalWidth) return;
        maskCanvas.width = MAP_W;
        maskCanvas.height = MAP_H;
        overlayCanvas.width = MAP_W;
        overlayCanvas.height = MAP_H;
        const sample = document.createElement('canvas');
        sample.width = MAP_W;
        sample.height = MAP_H;
        const sampleCtx = sample.getContext('2d');
        sampleCtx.drawImage(mapImage, 0, 0, MAP_W, MAP_H);
        const pixels = sampleCtx.getImageData(0, 0, MAP_W, MAP_H);
        const mask = maskCtx.createImageData(MAP_W, MAP_H);
        for (let i = 0; i < pixels.data.length; i += 4) {
          const r = pixels.data[i];
          const g = pixels.data[i + 1];
          const b = pixels.data[i + 2];
          const isTealWater = b > 100 && g > 90 && b > r + 48 && g > r + 28 && Math.abs(b - g) < 95;
          const a = isTealWater ? 180 : 0;
          mask.data[i] = 255;
          mask.data[i + 1] = 255;
          mask.data[i + 2] = 255;
          mask.data[i + 3] = a;
        }
        maskCtx.putImageData(mask, 0, 0);
        waterMaskReady = true;
      }

      function beginCamera(target) {
        cameraFrom = { ...camera };
        cameraTo = { ...target };
        cameraStart = performance.now();
      }

      function selectOverview() {
        activeWorld = -1;
        stageLabel.textContent = 'Turtle Island overview';
        statusLabel.textContent = 'Turquoise water · flowing preview';
        beginCamera({ x: 0, y: 0, w: MAP_W, h: MAP_H });
        [...worldBar.children].forEach((b) => b.classList.remove('active'));
      }

      function selectWorld(index) {
        const [x, y, w, h] = worlds[index].crop;
        activeWorld = index;
        stageLabel.textContent = worlds[index].title;
        statusLabel.textContent = 'Camera pan → exact Turtle Island district';
        beginCamera({ x, y, w, h });
        [...worldBar.children].forEach((b, i) => b.classList.toggle('active', i === index));
      }

      function buildWorldButtons() {
        worlds.forEach((world, i) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'button world-button';
          button.textContent = `World ${i + 1}`;
          button.title = world.title;
          button.addEventListener('click', () => selectWorld(i));
          worldBar.appendChild(button);
        });
      }

      function drawWaterOverlay(sx, sy, sw, sh, dx, dy, dw, dh) {
        if (!waterMaskReady || !waveFrames[waveFrame].complete) return;
        const tile = waveFrames[waveFrame];
        overlayCtx.clearRect(0, 0, MAP_W, MAP_H);
        overlayCtx.globalAlpha = .42;
        for (let y = -365; y < MAP_H + 365; y += 365) {
          for (let x = -362 + (waveShift % 362); x < MAP_W + 362; x += 362) {
            overlayCtx.drawImage(tile, x, y, 362, 365);
          }
        }
        overlayCtx.globalAlpha = 1;
        overlayCtx.globalCompositeOperation = 'destination-in';
        overlayCtx.drawImage(maskCanvas, 0, 0);
        overlayCtx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = .62;
        ctx.drawImage(overlayCanvas, sx, sy, sw, sh, dx, dy, dw, dh);
        ctx.globalAlpha = 1;
      }

      function render(now = performance.now()) {
        if (!mapImage.complete || !mapImage.naturalWidth) return;
        const progress = Math.min(1, (now - cameraStart) / CAMERA_MS);
        const eased = progress < 1 ? (1 - Math.cos(progress * Math.PI)) / 2 : 1;
        camera = {
          x: cameraFrom.x + (cameraTo.x - cameraFrom.x) * eased,
          y: cameraFrom.y + (cameraTo.y - cameraFrom.y) * eased,
          w: cameraFrom.w + (cameraTo.w - cameraFrom.w) * eased,
          h: cameraFrom.h + (cameraTo.h - cameraFrom.h) * eased
        };
        const scale = Math.min(canvas.width / camera.w, canvas.height / camera.h);
        const dw = camera.w * scale;
        const dh = camera.h * scale;
        const dx = (canvas.width - dw) / 2;
        const dy = (canvas.height - dh) / 2;
        ctx.fillStyle = '#062b38';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(mapImage, camera.x, camera.y, camera.w, camera.h, dx, dy, dw, dh);
        drawWaterOverlay(camera.x, camera.y, camera.w, camera.h, dx, dy, dw, dh);
        if (progress < 1) requestAnimationFrame(render);
      }

      function tickWater() {
        waveFrame = (waveFrame + 1) % waveFrames.length;
        waveShift = (waveShift + 18) % 362;
        render();
      }

      mapImage.addEventListener('load', () => { buildWaterMask(); resizeCanvas(); });
      window.addEventListener('resize', resizeCanvas, { passive: true });
      overviewButton.addEventListener('click', selectOverview);
      assetsButton.addEventListener('click', () => assetDrawer.classList.add('open'));
      closeAssetsButton.addEventListener('click', () => assetDrawer.classList.remove('open'));
      buildWorldButtons();
      setInterval(tickWater, 135);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    })();
  </script>
</body>
</html>
